
<section class="rsvp-section" id="rsvp">
  <div class="rsvp-card">

      <p class="rsvp-small">WE WOULD LOVE TO CELEBRATE WITH YOU</p>

      <h2>Kindly Respond</h2>

      <p class="rsvp-description">
          It would fill our hearts to have you with us.
          Please let us know if you can join Nyra's celebration.
      </p>

      <form id="rsvpForm">

          <label for="guestName">Your Name *</label>
          <input
              type="text"
              id="guestName"
              placeholder="Enter your full name"
              maxlength="80"
              autocomplete="name"
              required
          >

          <label>Will you be celebrating with us? *</label>

          <div class="attendance-options">
              <label>
                  <input type="radio" name="attending" value="Yes" required>
                  Yes, will be there to celebrate Nyra
              </label>

              <label>
                  <input type="radio" name="attending" value="No">
                  No, will miss this celebration
              </label>
          </div>

          <label for="guestCount">Number of Guests *</label>
          <input
              type="number"
              id="guestCount"
              min="1"
              max="20"
              placeholder="Including yourself"
              required
          >

          <label for="guestMessage">Your Blessings for Nyra</label>
          <textarea
              id="guestMessage"
              placeholder="Share a blessing, a wish, or a sweet memory…"
              rows="4"
              maxlength="500"
          ></textarea>

          <!-- Hidden trap for bots. Humans never see or fill it. -->
          <div class="rsvp-hp" aria-hidden="true">
              <label for="guestWebsite">Leave this field empty</label>
              <input
                  type="text"
                  id="guestWebsite"
                  name="website"
                  tabindex="-1"
                  autocomplete="off"
              >
          </div>

          <button type="submit">Submit RSVP ♡</button>

          <p id="rsvpMessage" role="status" aria-live="polite"></p>

      </form>
  </div>
</section>
