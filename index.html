<!-- Guidance cues: next-section buttons + "tap / scratch" hints -->
<link rel="stylesheet" href="css/guide.css">

    <script src="js/main.js" defer></script>

    <!-- Section JavaScript -->
    <script src="intro/intro.js" defer></script>
    <script src="hero/hero.js" defer></script>
    <script src="invitation/invitation.js" defer></script>
    <script src="savedate/savedate.js" defer></script>
    <script src="savedate/tiny-nyra.js" defer></script>
    <script src="bappu-bomma/bappu-bomma.js" defer></script>
    <script src="venue/venue.js" defer></script>
    <script src="gallery/gallery.js" defer></script>
    <script src="rsvp/rsvp.js" defer></script>
    <script src="footer/footer.js" defer></script>
<script src="js/guide.js" defer></script>
</head>

<body>

    <div id="intro-mount"></div>

    <main id="site-sections">
        <p class="loading-message">Preparing your invitation…</p>
    </main>

    <!-- BACKGROUND MUSIC -->
    <audio id="nyraMusic" loop preload="auto">
        <source src="assets/music/nyra-background.mp3" type="audio/mpeg">
    </audio>

    <!-- MUSIC BUTTON -->
    <button id="nyraMusicButton" aria-label="Play background music">
        ♫ Play Music
    </button>

    <style>
        #nyraMusicButton {
            display: block;
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 100001;

            padding: 10px 16px;
            border: 1px solid var(--c-gold);
            border-radius: 30px;

            background: rgba(255, 248, 239, 0.96);
            color: var(--c-raspberry-deep);

            font-family: var(--font-serif);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;

            box-shadow: 0 4px 15px rgba(100, 50, 50, 0.15);
        }

        #nyraMusicButton:hover {
            background: var(--c-raspberry);
            color: var(--c-ivory);
        }

        @media (max-width: 600px) {
            #nyraMusicButton {
                top: 15px;
                right: 15px;
                padding: 9px 13px;
                font-size: 12px;
            }
        }
    </style>

    <!-- MUSIC CONTROLS -->
    <script>
        const nyraMusic = document.getElementById("nyraMusic");
        const musicButton = document.getElementById("nyraMusicButton");

        // true once the guest has pressed Pause themselves,
        // so we never restart music they chose to stop
        let userPaused = false;

        function showPlaying() {
            musicButton.textContent = "Ⅱ Pause Music";
            musicButton.setAttribute("aria-label", "Pause background music");
        }

        function showPaused() {
            musicButton.textContent = "♫ Play Music";
            musicButton.setAttribute("aria-label", "Play background music");
        }

        nyraMusic.preload = "auto";
        nyraMusic.volume = 0.6;

        nyraMusic.addEventListener("play", () => {
            showPlaying();
            removeGestureListeners();
        });
        nyraMusic.addEventListener("pause", showPaused);

        // Pause/Play button
        musicButton.addEventListener("click", async () => {
            if (nyraMusic.paused) {
                userPaused = false;
                try {
                    await nyraMusic.play();
                } catch (error) {
                    musicButton.textContent = "♫ Music unavailable";
                    console.error("Music playback failed:", error);
                }
            } else {
                userPaused = true;
                nyraMusic.pause();
            }
        });

        // AUTO-START
        // 1) Try straight away (works on some desktop browsers).
        // 2) Browsers usually block that, so start on the guest's first
        //    tap / click / keypress anywhere on the page.
        const gestureEvents = ["pointerdown", "touchend", "click", "keydown"];

        function tryStart(event) {
            // the music button handles its own clicks
            if (event && event.target && musicButton.contains(event.target)) return;
            if (userPaused || !nyraMusic.paused) return;

            nyraMusic.play().catch(() => {
                // still blocked: keep listening for the next gesture
            });
        }

        function removeGestureListeners() {
            gestureEvents.forEach(type =>
                document.removeEventListener(type, tryStart, true)
            );
        }

        gestureEvents.forEach(type =>
            document.addEventListener(type, tryStart, true)
        );

        // Start the music the moment the intro video starts playing.
        // If the browser blocks sound without a tap, the gesture listeners
        // above start it on the guest's first tap, even mid-video.
        document.addEventListener("introVideoPlaying", () => {
            if (userPaused || !nyraMusic.paused) return;
            nyraMusic.play().catch(() => {});
        });

        nyraMusic.play().catch(() => {});
    </script>

</body>
</html>
