# Keeps the free Supabase project from pausing after ~7 days of quiet.
# Once a day it reads one row through the public API (real database activity).
# The publishable key is read from admin/script.js, so it lives in one place.
# If this job fails, GitHub emails the repo owner: that is the early warning.
name: keep-supabase-awake

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read one row from the database
        run: |
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' admin/script.js | head -1)
          if [ -z "$KEY" ]; then echo "No publishable key found in admin/script.js"; exit 1; fi
          URL="https://bcubwgmzbeqpedmhvmfj.supabase.co/rest/v1/site_content?select=*&limit=1"
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then cat /tmp/out.json; exit 1; fi
          echo "Supabase answered. Project is awake."
